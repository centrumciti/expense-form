<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกค่าใช้จ่าย</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px 16px 40px;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
  .type-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #ddd;
    background: #fff; font-size: 15px; font-weight: 600; color: #666;
  }
  .type-btn.active.variable { border-color: #ff7a45; color: #ff7a45; background: #fff3ec; }
  .type-btn.active.fixed { border-color: #4a7cff; color: #4a7cff; background: #eef2ff; }
  label { display: block; font-size: 13px; font-weight: 600; color: #444; margin: 16px 0 6px; }
  select, input, textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;
    font-size: 16px; background: #fff;
  }
  textarea { resize: none; min-height: 60px; }
  button#submitBtn {
    margin-top: 24px; width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: #06c755; color: #fff; font-size: 16px; font-weight: 700;
  }
  button#submitBtn:disabled { background: #aaa; }
  #status { margin-top: 12px; font-size: 13px; text-align: center; color: #666; }
  #status.error { color: #e04b4b; }

  .divider { border: none; border-top: 1px solid #e0e0e0; margin: 32px 0 20px; }
  h2.section-title { font-size: 15px; margin: 0 0 12px; color: #333; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick-btn {
    padding: 14px 8px; border-radius: 10px; border: 1px solid #ddd;
    background: #fff; font-size: 14px; font-weight: 600; color: #333;
  }
  .quick-btn.danger {
    grid-column: 1 / -1; border: 2px solid #e04b4b; color: #e04b4b; background: #fff5f5;
  }
  #quickStatus { margin-top: 12px; font-size: 13px; text-align: center; color: #666; }
  #quickStatus.error { color: #e04b4b; }

  .pick-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .pick-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; border-radius: 10px; border: 1px solid #e0e0e0; background: #fff;
  }
  .pick-item-info { font-size: 13px; color: #333; line-height: 1.5; }
  .pick-item-info .cat { font-weight: 700; }
  .pick-item-info .meta { color: #888; font-size: 12px; }
  .pick-delete-btn {
    flex-shrink: 0; margin-left: 10px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid #e04b4b; color: #e04b4b; background: #fff5f5; font-size: 13px; font-weight: 600;
  }
  .pick-delete-btn:disabled { opacity: 0.5; }
  #pickListStatus { margin-top: 10px; font-size: 13px; text-align: center; color: #666; }
  #pickListStatus.error { color: #e04b4b; }
</style>
</head>
<body>

<h1>บันทึกค่าใช้จ่าย</h1>
<p class="sub">เลือกประเภท กรอกข้อมูล แล้วกดส่ง</p>

<div class="type-toggle">
  <button type="button" class="type-btn variable active" id="btnVariable">ผันแปร (จ่าย)</button>
  <button type="button" class="type-btn fixed" id="btnFixed">คงที่</button>
</div>

<label for="category">หมวด</label>
<select id="category"></select>

<label for="amount">จำนวนเงิน (บาท)</label>
<input type="number" id="amount" inputmode="decimal" placeholder="เช่น 500" min="0" step="0.01">

<label for="dateInput">วันที่ (ไม่กรอก = วันนี้)</label>
<input type="date" id="dateInput">

<label for="detail">รายละเอียด (ไม่บังคับ)</label>
<textarea id="detail" placeholder="เช่น ค่าน้ำประปาเดือนนี้"></textarea>

<button id="submitBtn">ส่งข้อมูล</button>
<div id="status"></div>

<hr class="divider">
<h2 class="section-title">คำสั่งด่วน</h2>
<div class="quick-grid">
  <button type="button" class="quick-btn" data-cmd="สรุป">สรุป</button>
  <button type="button" class="quick-btn" data-cmd="คืนทุน">คืนทุน</button>
  <button type="button" class="quick-btn" data-cmd="ค่าใช้จ่ายเดือนนี้">ค่าใช้จ่ายเดือนนี้</button>
  <button type="button" class="quick-btn danger" data-cmd="ลบล่าสุด">ลบรายการล่าสุด</button>
</div>
<div id="quickStatus"></div>

<hr class="divider">
<h2 class="section-title">เลือกลบรายการ</h2>
<button type="button" id="loadListBtn" class="quick-btn" style="width:100%">แสดงรายการล่าสุด 10 รายการ</button>
<div id="pickList" class="pick-list"></div>
<div id="pickListStatus"></div>

<script>
  const LIFF_ID = "2011412816-xGVEjhx9";
  const API_BASE = "https://armahosting.synology.me:15678/webhook";
  let currentType = "จ่าย";
  let userDisplayName = "";
  let currentUserId = "";

  function withName(text) {
    return userDisplayName ? text + " (บันทึกโดย: " + userDisplayName + ")" : text;
  }

  const ALL_CATEGORIES = ["ค่าน้ำ", "ค่าไฟ", "ค่าเช่า", "ค่าโฟม", "ค่าซ่อมบำรุง", "ค่าเบ็ดเตล็ด"];
  const RECOMMENDED = {
    "จ่าย": ["ค่าน้ำ", "ค่าไฟ", "ค่าโฟม"],
    "คงที่": ["ค่าเช่า", "ค่าซ่อมบำรุง", "ค่าเบ็ดเตล็ด"]
  };

  const categorySelect = document.getElementById("category");

  function populateCategories(type) {
    const previousValue = categorySelect.value;
    const recommended = RECOMMENDED[type];
    const others = ALL_CATEGORIES.filter((c) => !recommended.includes(c));
    categorySelect.innerHTML = "";

    const grpRecommended = document.createElement("optgroup");
    grpRecommended.label = "แนะนำสำหรับ" + type;
    recommended.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      grpRecommended.appendChild(opt);
    });
    categorySelect.appendChild(grpRecommended);

    const grpOthers = document.createElement("optgroup");
    grpOthers.label = "หมวดอื่นๆ";
    others.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      grpOthers.appendChild(opt);
    });
    categorySelect.appendChild(grpOthers);

    // keep the user's previous selection if it's still a valid category
    if (ALL_CATEGORIES.includes(previousValue)) {
      categorySelect.value = previousValue;
    }
  }

  populateCategories(currentType);

  const btnVariable = document.getElementById("btnVariable");
  const btnFixed = document.getElementById("btnFixed");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  btnVariable.addEventListener("click", () => {
    currentType = "จ่าย";
    btnVariable.classList.add("active");
    btnFixed.classList.remove("active");
    populateCategories(currentType);
  });
  btnFixed.addEventListener("click", () => {
    currentType = "คงที่";
    btnFixed.classList.add("active");
    btnVariable.classList.remove("active");
    populateCategories(currentType);
  });

  function pad(n) { return n < 10 ? "0" + n : n; }

  submitBtn.addEventListener("click", async () => {
    const category = document.getElementById("category").value;
    const amount = document.getElementById("amount").value;
    const dateVal = document.getElementById("dateInput").value; // YYYY-MM-DD or ""
    const detail = document.getElementById("detail").value.trim();

    if (!amount || Number(amount) <= 0) {
      statusEl.textContent = "กรุณากรอกจำนวนเงินให้ถูกต้อง";
      statusEl.classList.add("error");
      return;
    }

    let parts = [currentType, category, amount];
    if (dateVal) parts.push(dateVal);
    if (detail) parts.push(detail);
    const message = withName(parts.join(" "));

    submitBtn.disabled = true;
    statusEl.classList.remove("error");
    statusEl.textContent = "กำลังส่ง...";

    try {
      await liff.sendMessages([{ type: "text", text: message }]);
      statusEl.textContent = "ส่งสำเร็จ กำลังปิดหน้าต่าง...";
      setTimeout(() => liff.closeWindow(), 800);
    } catch (err) {
      statusEl.textContent = "ส่งไม่สำเร็จ: " + (err && err.message ? err.message : "ลองใหม่อีกครั้ง");
      statusEl.classList.add("error");
      submitBtn.disabled = false;
    }
  });

  const quickStatusEl = document.getElementById("quickStatus");
  document.querySelectorAll(".quick-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const cmd = btn.getAttribute("data-cmd");
      if (cmd === "ลบล่าสุด") {
        const ok = confirm("ยืนยันลบรายการค่าใช้จ่ายล่าสุดที่บันทึกไว้?");
        if (!ok) return;
      }
      document.querySelectorAll(".quick-btn").forEach((b) => (b.disabled = true));
      quickStatusEl.classList.remove("error");
      quickStatusEl.textContent = "กำลังส่ง...";
      const textToSend = cmd === "ลบล่าสุด" ? withName(cmd) : cmd;
      try {
        await liff.sendMessages([{ type: "text", text: textToSend }]);
        quickStatusEl.textContent = "ส่งสำเร็จ กำลังปิดหน้าต่าง...";
        setTimeout(() => liff.closeWindow(), 800);
      } catch (err) {
        quickStatusEl.textContent = "ส่งไม่สำเร็จ: " + (err && err.message ? err.message : "ลองใหม่อีกครั้ง");
        quickStatusEl.classList.add("error");
        document.querySelectorAll(".quick-btn").forEach((b) => (b.disabled = false));
      }
    });
  });

  const loadListBtn = document.getElementById("loadListBtn");
  const pickListEl = document.getElementById("pickList");
  const pickListStatusEl = document.getElementById("pickListStatus");

  const typeLabel = (t) => (t === "fixed" ? "ค่าใช้จ่ายคงที่" : "ค่าใช้จ่ายผันแปร");

  function renderPickList(items) {
    pickListEl.innerHTML = "";
    if (!items.length) {
      pickListStatusEl.classList.remove("error");
      pickListStatusEl.textContent = "ไม่พบรายการค่าใช้จ่าย";
      return;
    }
    pickListStatusEl.textContent = "";
    items.forEach((item) => {
      const row = document.createElement("div");
      row.className = "pick-item";

      const info = document.createElement("div");
      info.className = "pick-item-info";
      const amountStr = Number(item.amount).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      info.innerHTML =
        '<div class="cat">' + item.category + " · " + amountStr + " บาท</div>" +
        '<div class="meta">' + typeLabel(item.expense_type) + " · " + item.expense_date +
        (item.description ? " · " + item.description : "") + "</div>";

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "pick-delete-btn";
      delBtn.textContent = "ลบ";
      delBtn.addEventListener("click", async () => {
        const ok = confirm("ยืนยันลบรายการนี้?\n" + item.category + " " + amountStr + " บาท (" + item.expense_date + ")");
        if (!ok) return;
        delBtn.disabled = true;
        pickListStatusEl.classList.remove("error");
        pickListStatusEl.textContent = "กำลังลบ...";
        try {
          const res = await fetch(API_BASE + "/carwash-delete-expense", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: item.id, userId: currentUserId })
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          row.remove();
          pickListStatusEl.textContent = "ลบสำเร็จ";
          const confirmMsg = withName(
            "ลบรายการที่เลือก: " + item.category + " " + amountStr + " บาท (" + item.expense_date + ")"
          );
          try { await liff.sendMessages([{ type: "text", text: confirmMsg }]); } catch (e) {}
        } catch (err) {
          pickListStatusEl.classList.add("error");
          pickListStatusEl.textContent = "ลบไม่สำเร็จ: " + (err && err.message ? err.message : "ลองใหม่อีกครั้ง");
          delBtn.disabled = false;
        }
      });

      row.appendChild(info);
      row.appendChild(delBtn);
      pickListEl.appendChild(row);
    });
  }

  loadListBtn.addEventListener("click", async () => {
    if (!currentUserId) {
      pickListStatusEl.classList.add("error");
      pickListStatusEl.textContent = "ไม่พบข้อมูลผู้ใช้ ลองเปิดฟอร์มใหม่อีกครั้ง";
      return;
    }
    loadListBtn.disabled = true;
    pickListEl.innerHTML = "";
    pickListStatusEl.classList.remove("error");
    pickListStatusEl.textContent = "กำลังโหลด...";
    try {
      const res = await fetch(API_BASE + "/carwash-list-expenses?userId=" + encodeURIComponent(currentUserId));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      renderPickList(data.items || []);
    } catch (err) {
      pickListStatusEl.classList.add("error");
      pickListStatusEl.textContent = "โหลดไม่สำเร็จ: " + (err && err.message ? err.message : "ลองใหม่อีกครั้ง");
    } finally {
      loadListBtn.disabled = false;
    }
  });

  liff.init({ liffId: LIFF_ID })
    .then(async () => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      try {
        const profile = await liff.getProfile();
        userDisplayName = profile.displayName || "";
        currentUserId = profile.userId || "";
      } catch (e) {
        // ถ้าดึงชื่อไม่ได้ ก็ยังส่งข้อมูลได้ปกติ เพียงแค่ไม่มีชื่อกำกับ
      }
    })
    .catch((err) => {
      statusEl.textContent = "เปิดใช้งานไม่สำเร็จ: " + (err && err.message ? err.message : "");
      statusEl.classList.add("error");
    });
</script>

</body>
</html>
